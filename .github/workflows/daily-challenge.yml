name: Update Daily Code Challenge

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update daily challenge and quote link
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          import re

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          challenges = [
              ("Two Sum", "Given a list of integers and a target, return the indices of two numbers that add up to the target."),
              ("Valid Parentheses", "Determine whether a string containing brackets has valid and correctly nested pairs."),
              ("Longest Palindromic Substring", "Find the longest substring that reads the same forwards and backwards."),
              ("Reverse a Linked List", "Reverse a singly linked list and return the new head."),
              ("Maximum Subarray", "Find the contiguous subarray with the largest possible sum."),
              ("FizzBuzz", "Print numbers from 1 to n, replacing multiples of 3 with Fizz, 5 with Buzz, and both with FizzBuzz."),
              ("Binary Search", "Find the position of a target value in a sorted array using binary search."),
          ]

          tech_facts = [
              "The first computer bug was an actual bug! In 1947, a moth found in a Harvard Mark II computer helped popularize the term.",
              "The first website is still online and was created by Tim Berners-Lee at CERN.",
              "Python was named after the comedy group Monty Python, not the snake.",
              "The first computer mouse was made of wood.",
              "The Apollo 11 guidance computer had less computing power than a modern smartphone.",
              "The term 'debugging' became popular in early computing because engineers literally removed faults from machines.",
              "Git was created by Linus Torvalds to help manage the development of the Linux kernel.",
          ]

          day_index = date.today().toordinal()
          title, prompt = challenges[day_index % len(challenges)]
          fact = tech_facts[day_index % len(tech_facts)]

          challenge_block = f'''**🧩 Today's coding challenge: {title}**\n\n> {prompt}\n\n💡 *Come back tomorrow for a new challenge!*'''
          fact_block = f'''**🎲 Random Tech Fact Generator**\n\n**Did you know?** {fact}'''

          # Update only the challenge and tech-fact content inside Interactive Challenges.
          challenge_pattern = r"\*\*🧩.*?(?=\n\n\*\*🎲 Random Tech Fact Generator\*\*)"
          text, challenge_count = re.subn(challenge_pattern, challenge_block, text, flags=re.DOTALL)
          if challenge_count != 1:
              raise SystemExit(f"Expected exactly one coding challenge section, found {challenge_count}.")

          fact_pattern = r"\*\*🎲 Random Tech Fact Generator\*\*.*?(?=\n\n---\n\n## )"
          text, fact_count = re.subn(fact_pattern, fact_block, text, flags=re.DOTALL)
          if fact_count != 1:
              raise SystemExit(f"Expected exactly one tech fact section, found {fact_count}.")

          readme.write_text(text, encoding="utf-8")
          PY

      - name: Commit updated README
        run: |
          if git diff --quiet; then
            echo "No README changes needed today."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update daily coding challenge"
            git push
          fi
